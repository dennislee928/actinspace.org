name: Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build ttc-gateway
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -v -o dist/ttc-gateway-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./ttc-gateway/cmd/ttc-gateway

      - name: Build ground-station-sim
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -v -o dist/ground-station-sim-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./ground-station-sim/cmd/ground-station-sim

      - name: Build satellite-sim
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -v -o dist/satellite-sim-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./satellite-sim/cmd/satellite-sim

      - name: Build ota-controller
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -v -o dist/ota-controller-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./supply-chain/ota-controller/cmd/ota-controller

      - name: Build space-soc-backend
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -v -o dist/space-soc-backend-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./space-soc/backend/cmd/space-soc

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
