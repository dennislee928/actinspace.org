name: Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ttc-gateway/Dockerfile
            image: actinspace.org/ttc-gateway
          - dockerfile: ground-station-sim/Dockerfile
            image: actinspace.org/ground-station-sim
          - dockerfile: satellite-sim/Dockerfile
            image: actinspace.org/satellite-sim
          - dockerfile: supply-chain/ota-controller/Dockerfile
            image: actinspace.org/ota-controller
          - dockerfile: space-soc/frontend/Dockerfile
            image: actinspace.org/space-soc-frontend
          - dockerfile: space-soc/backend/Dockerfile
            image: actinspace.org/space-soc-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
